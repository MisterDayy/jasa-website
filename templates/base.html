<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nexlab — Jasa Pembuatan Website{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0D0E1A',
            surface: '#161829',
            surface2: '#1F2136',
            line: '#2A2C45',
            ink: '#E8E8F0',
            muted: '#9294B0',
            amber: '#F5A623',
            violet: '#8B7FFF',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif}
    .grid-bg{
      background-image: linear-gradient(#1F2136 1px, transparent 1px), linear-gradient(90deg, #1F2136 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>
<body class="bg-bg text-ink font-body">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="max-w-3xl mx-auto mt-4 px-4 space-y-2">
        {% for category, message in messages %}
          <div class="rounded-lg px-4 py-3 text-sm font-medium border {{ 'bg-red-950/40 text-red-300 border-red-800' if category == 'error' else 'bg-emerald-950/40 text-emerald-300 border-emerald-800' }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
