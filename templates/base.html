<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nexlab — Jasa Pembuatan Website{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0D0E1A',
            surface: '#161829',
            surface2: '#1F2136',
            line: '#2A2C45',
            ink: '#E8E8F0',
            muted: '#9294B0',
            amber: '#F5A623',
            violet: '#8B7FFF',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif}
    .grid-bg{
      background-image: linear-gradient(#1F2136 1px, transparent 1px), linear-gradient(90deg, #1F2136 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .glow{ filter: blur(90px); }
    .reveal{ opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in{ opacity: 1; transform: translateY(0); }
    @keyframes pulse-soft{
      0%, 100% { box-shadow: 0 0 0 0 rgba(245,166,35,.35); }
      50% { box-shadow: 0 0 0 8px rgba(245,166,35,0); }
    }
    .pulse-dot{ animation: pulse-soft 2.2s ease-in-out infinite; }
    @keyframes float-slow{
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    .float-slow{ animation: float-slow 6s ease-in-out infinite; }
  </style>
</head>
<body class="bg-bg text-ink font-body overflow-x-hidden">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="max-w-3xl mx-auto mt-4 px-4 space-y-2">
        {% for category, message in messages %}
          <div class="rounded-lg px-4 py-3 text-sm font-medium border {{ 'bg-red-950/40 text-red-300 border-red-800' if category == 'error' else 'bg-emerald-950/40 text-emerald-300 border-emerald-800' }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script>
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
</body>
</html>
