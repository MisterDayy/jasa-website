{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}
{% block content %}

<nav class="max-w-6xl mx-auto px-6 py-6 border-b border-line">
  <span class="font-display font-semibold text-lg tracking-tight">nex<span class="text-amber">lab</span></span>
</nav>

<div class="max-w-sm mx-auto px-6 py-24">
  <p class="font-mono text-xs tracking-widest text-violet mb-4">ADMIN</p>
  <h1 class="font-display text-2xl font-semibold mb-8">Login</h1>
  <form method="POST" class="space-y-4 border-t border-line pt-6">
    <div>
      <label class="text-sm font-medium text-muted">Username</label>
      <input type="text" name="username" required class="mt-1 w-full bg-surface border border-line rounded-md px-3 py-2 text-ink focus:outline-none focus:border-violet">
    </div>
    <div>
      <label class="text-sm font-medium text-muted">Password</label>
      <input type="password" name="password" required class="mt-1 w-full bg-surface border border-line rounded-md px-3 py-2 text-ink focus:outline-none focus:border-violet">
    </div>
    <button type="submit" class="w-full py-3 rounded-md bg-amber text-bg font-semibold hover:bg-white transition">Masuk</button>
  </form>
</div>
{% endblock %}
