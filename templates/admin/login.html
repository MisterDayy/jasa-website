{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-6 py-24">
  <h1 class="font-display text-2xl font-semibold mb-6 text-center">Login Admin</h1>
  <form method="POST" class="space-y-4 bg-surface border border-line rounded-2xl p-6">
    <div>
      <label class="text-sm font-medium text-muted">Username</label>
      <input type="text" name="username" required class="mt-1 w-full bg-surface2 border border-line rounded-lg px-3 py-2 text-ink focus:outline-none focus:ring-2 focus:ring-violet">
    </div>
    <div>
      <label class="text-sm font-medium text-muted">Password</label>
      <input type="password" name="password" required class="mt-1 w-full bg-surface2 border border-line rounded-lg px-3 py-2 text-ink focus:outline-none focus:ring-2 focus:ring-violet">
    </div>
    <button type="submit" class="w-full py-3 rounded-full bg-amber text-bg font-semibold hover:bg-violet hover:text-white transition">Masuk</button>
  </form>
</div>
{% endblock %}
