{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-6 py-24">
  <h1 class="font-display text-2xl font-semibold mb-6 text-center">Login Admin</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="text-sm font-medium">Username</label>
      <input type="text" name="username" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent">
    </div>
    <div>
      <label class="text-sm font-medium">Password</label>
      <input type="password" name="password" required class="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-accent">
    </div>
    <button type="submit" class="w-full py-3 rounded-full bg-ink text-white font-semibold hover:bg-accent transition">Masuk</button>
  </form>
</div>
{% endblock %}
